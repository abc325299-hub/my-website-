<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Online Tools & Tips</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2563eb;
    }

    input, button, textarea {
      padding: 10px;
      margin: 5px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    input {
      width: 95%;
    }

    textarea {
      width: 95%;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      padding: 11px 18px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      font-weight: bold;
      color: #15803d;
    }

    footer {
      text-align: center;
      background: #222;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Free Online Tools & Tips</h1>
    <p>Useful free tools and helpful online tips</p>
  </header>

  <div class="container">

    <!-- Percentage Calculator -->
    <div class="card">
      <h2>Percentage Calculator</h2>

      <input type="number" id="number" placeholder="Enter number">
      <input type="number" id="percent" placeholder="Enter percentage">

      <br>
      <button onclick="calculatePercentage()">Calculate</button>

      <p id="percentageResult" class="result"></p>
    </div>


    <!-- Age Calculator -->
    <div class="card">
      <h2>Age Calculator</h2>

      <input type="date" id="birthDate">

      <br>
      <button onclick="calculateAge()">Calculate Age</button>

      <p id="ageResult" class="result"></p>
    </div>


    <!-- Word Counter -->
    <div class="card">
      <h2>Word Counter</h2>

      <textarea id="textInput" rows="5"
        placeholder="Write or paste your text here"></textarea>

      <br>
      <button onclick="countWords()">Count Words</button>

      <p id="wordResult" class="result"></p>
    </div>


    <!-- Unit Converter -->
    <div class="card">
      <h2>Unit Converter</h2>

      <input type="number" id="kmInput" placeholder="Enter kilometers">

      <br>
